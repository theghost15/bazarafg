<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة بازار</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#18212f;--muted:#718096;--line:#e7ebf0;--brand:#111827;--soft:#f8fafc;--gold:#b88a44;--danger:#b42318;--success:#087443}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}.shell{min-height:100vh;display:flex}.side{width:250px;background:#111827;color:#fff;padding:22px 16px;position:fixed;right:0;top:0;bottom:0;z-index:20;overflow:auto}.brand{font-size:27px;font-weight:900;padding:8px 12px 22px}.brand small{display:block;color:#aeb7c5;font-size:11px;font-weight:500;margin-top:6px}.side-nav{display:grid;gap:6px}.side button{width:100%;text-align:right;border:0;background:transparent;color:#d7dee8;padding:12px 13px;border-radius:12px;cursor:pointer}.side button:hover,.side button.active{background:#253044;color:#fff}.side .super{background:linear-gradient(135deg,#3b2b12,#7a5a26);color:#fff}.main{width:calc(100% - 250px);margin-right:250px;padding:26px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.topbar h1{margin:0;font-size:26px}.userbox{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:12px;color:var(--muted);font-size:13px}.wrap{max-width:1500px;margin:auto}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 6px 24px #11182708}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 24px #11182708}.stat .ico{font-size:23px}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:10px}.stat b{display:block;font-size:27px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px;margin:10px 0}.field label{font-weight:800;font-size:13px}.field input,.field textarea,.field select{padding:12px 13px;border:1px solid #d8dee7;border-radius:11px;background:#fff;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8b97a8;box-shadow:0 0 0 3px #1118270b}.btn,.tab{border:1px solid #d6dce5;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.btn:hover,.tab:hover{background:#f7f8fa}.primary{background:#111827;color:#fff;border-color:#111827}.primary:hover{background:#263143}.danger{color:var(--danger)}.success{color:var(--success)}.small{color:var(--muted);font-size:13px}.prod{display:flex;gap:16px;align-items:flex-start}.prod img{width:88px;height:88px;object-fit:cover;border-radius:12px;background:#eee}.variant{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.variantgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.variantgrid input{padding:9px;border:1px solid #ccc;border-radius:8px}.login{max-width:430px;margin:80px auto;background:#fff;padding:28px;border-radius:20px;border:1px solid var(--line);box-shadow:0 20px 60px #00000012}.msg{padding:10px;border-radius:10px;background:#f6f6f6;margin:10px 0}.ok{background:#ecfdf3}.err{background:#fff1f2;color:#991b1b}.thumb{width:90px;height:90px;object-fit:cover;border-radius:10px;margin:5px;border:1px solid #ddd}.hero{background:linear-gradient(135deg,#111827,#263143);color:#fff;border-radius:22px;padding:24px;margin-bottom:16px}.hero h2{margin:0 0 8px;font-size:25px}.hero p{margin:0;color:#cbd5e1}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.quick button{padding:15px;border:1px solid #ffffff20;background:#ffffff12;color:#fff;border-radius:14px;cursor:pointer;text-align:right}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-title h2,.section-title h3{margin:0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:13px 11px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}.table th{background:#fafbfc;color:#667085;font-size:12px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e9edf2;color:#364152;font-weight:900}.customer-name{display:flex;align-items:center;gap:10px}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.badge.green{background:#ecfdf3;color:#087443}.badge.gray{background:#f2f4f7;color:#667085}.badge.gold{background:#fff7e6;color:#8a5b12}.badge.red{background:#fff1f2;color:#b42318}.searchbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.searchbar input{flex:1;min-width:230px;padding:12px 14px;border:1px solid #d8dee7;border-radius:11px}.customer-card{display:none}.drawer{position:fixed;inset:0;background:#0006;z-index:50;display:flex;justify-content:flex-start}.drawer-card{background:#fff;width:min(560px,94vw);height:100%;overflow:auto;padding:24px;box-shadow:0 0 50px #0003}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:var(--soft);border:1px solid var(--line);padding:14px;border-radius:14px}.metric b{display:block;font-size:21px;margin-top:5px}.mobile-head{display:none}@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.quick{grid-template-columns:repeat(2,1fr)}.variantgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.side{display:none}.wrap>.side~*{margin-right:0}.main{width:100%;margin-right:0;padding:15px}.mobile-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.stats{grid-template-columns:repeat(2,1fr)}.topbar{display:none}.quick{grid-template-columns:1fr 1fr}.metric-row{grid-template-columns:1fr 1fr}.prod{flex-direction:column}.variantgrid{grid-template-columns:repeat(2,1fr)}}

/* Dynamic admin shell */
:root{--side-w:250px;--side-collapsed:78px}
.side{width:var(--side-w);transition:width .25s ease;box-shadow:-8px 0 30px #00000012}
.side-toggle{position:absolute;left:12px;top:18px;width:38px!important;height:38px;padding:0!important;text-align:center!important;border:1px solid #ffffff22!important;background:#ffffff12!important;border-radius:10px!important}
.side .brand{padding-left:54px}
.side .nav-label{transition:opacity .18s}
.admin-page-wrap{margin-right:var(--side-w);transition:margin-right .25s ease;min-width:0}
.wrap:has(.side){margin-right:var(--side-w);transition:margin-right .25s ease}
.main .wrap{margin-right:0}
body.side-collapsed .side{width:var(--side-collapsed)}
body.side-collapsed .side .brand{font-size:0;padding-left:45px}
body.side-collapsed .side .brand small{display:none}
body.side-collapsed .side .nav-label{opacity:0;display:inline-block;width:0;overflow:hidden}
body.side-collapsed .side button{white-space:nowrap;text-align:center}
body.side-collapsed .wrap:has(.side){margin-right:var(--side-collapsed)}
body.side-collapsed .main .wrap{margin-right:0}
.lang-select{position:fixed;left:18px;bottom:18px;z-index:1000;padding:10px 12px;border:1px solid #d8dee7;border-radius:11px;background:#fff;box-shadow:0 8px 30px #00000012}
.mobile-menu-btn{display:none}
@media(max-width:800px){.side{right:auto;left:0;transform:translateX(-105%);width:270px;transition:transform .25s ease}.side.open{transform:translateX(0)}.wrap:has(.side){margin-right:0}.mobile-menu-btn{display:inline-flex}.side-toggle{display:none}.main .wrap{margin-right:0}}

/* v4 people management + premium dashboard */
:root{--admin-accent:#b68a55;--admin-bg:#f5f7fa;--admin-side:258px}
body{background:var(--admin-bg)}
.admin-shell{min-height:100vh}.people-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.people-actions{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#f2f4f7;font-size:11px;font-weight:800}.status-dot{display:inline-flex;align-items:center;gap:6px}.status-dot:before{content:"";width:7px;height:7px;border-radius:50%;background:#16a34a}.status-dot.off:before{background:#ef4444}.people-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.people-stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.people-stat span{font-size:11px;color:var(--muted)}.people-stat b{display:block;font-size:24px;margin-top:7px}.people-table .actions{display:flex;gap:6px;flex-wrap:wrap}.modal-panel{position:fixed;inset:0;background:#0008;z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}.form-modal{background:#fff;width:min(680px,96vw);max-height:92vh;overflow:auto;border-radius:22px;padding:22px;box-shadow:0 25px 80px #0004}.form-modal h2{margin-top:0}.form-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}.hint{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11px;color:var(--muted);line-height:1.7}.danger-fill{background:#fff1f2!important;color:#b42318!important;border-color:#fecdd3!important}.success-fill{background:#ecfdf3!important;color:#087443!important;border-color:#bbf7d0!important}.premium-header{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:15px}.premium-header h1{margin:0 0 5px}.premium-header p{margin:0;color:var(--muted);font-size:12px}.side button{position:relative}.side button.active:after{content:"";position:absolute;right:4px;top:8px;bottom:8px;width:3px;border-radius:5px;background:var(--admin-accent)}
@media(max-width:1050px){.people-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.people-grid{grid-template-columns:1fr 1fr}.people-table .actions{flex-direction:column}.form-actions{flex-direction:column}.form-actions .btn{width:100%}}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script>
const sb=supabase.createClient(BAZAAR_SUPABASE.url,BAZAAR_SUPABASE.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let me=null,products=[],categories=[],settings=null,variants=[],sellers=[],customers=[];
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const val=id=>document.getElementById(id)?.value||'';const fmt=n=>Number(n||0).toLocaleString('ar-SA');
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session)return login();await checkUser();}
async function checkUser(){const {data:{user}}=await sb.auth.getUser();if(!user)return login();const {data:p,error}=await sb.from('profiles').select('role,full_name').eq('id',user.id).single();if(error||!p||!['super_admin','admin','staff'].includes(p.role)){await sb.auth.signOut();return login('الحساب ليس مخولًا لإدارة المتجر.')}me={user,profile:p};await loadAll();dashboard();}
function login(err=''){app.innerHTML=`<div class="login"><h2>🔐 دخول مدير بازار</h2><p class="small">تسجيل الدخول محمي بواسطة Supabase Auth وقواعد RLS. لا تستخدم أي مفتاح سري في المتصفح.</p>${err?`<div class="msg err">${esc(err)}</div>`:''}<div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" onclick="doLogin()">دخول</button></div>`}
async function doLogin(){const {error}=await sb.auth.signInWithPassword({email:val('email'),password:val('password')});if(error)return login(error.message);await checkUser()}
async function loadAll(){const [p,c,s,sp,cp]=await Promise.all([sb.from('products').select('*,categories(name_ar)').order('updated_at',{ascending:false}),sb.from('categories').select('*').order('sort_order'),sb.from('store_settings').select('*').eq('id',1).single(),sb.from('seller_profiles').select('id,seller_number,store_name,full_name,approved,active').eq('approved',true).eq('active',true).order('seller_number'),sb.from('profiles').select('*')]);if(p.error||c.error||s.error||sp.error)throw new Error(p.error?.message||c.error?.message||s.error?.message||sp.error?.message);products=(p.data||[]).map(x=>({...x,category_name:x.categories?.name_ar||''}));categories=c.data||[];settings=s.data||{id:1,store_name:'بازار',currency:'SAR',settings:{}};sellers=sp.data||[];customers=(cp.data||[]).filter(x=>x.role==='customer'||x.account_type==='buyer');}
function nav(){const superAdmin=me?.profile?.role==='super_admin';return `<aside class="side" id="adminSide"><button class="side-toggle" onclick="toggleSide()" title="توسيع/طي القائمة">☰</button><div class="brand">بازار<small>${superAdmin?'👑 SUPER ADMIN':'لوحة الإدارة'}</small></div><div class="side-nav"><button class="active" onclick="dashboard()">🏠 <span class="nav-label" data-admin-key="home">الرئيسية</span></button><button onclick="productsPage()">📦 <span class="nav-label" data-admin-key="products">المنتجات</span></button><button onclick="categoriesPage()">🗂️ <span class="nav-label" data-admin-key="categories">التصنيفات</span></button><button onclick="ordersPage()">🧾 <span class="nav-label" data-admin-key="orders">الطلبات</span></button><button onclick="customersPage()">👥 <span class="nav-label" data-admin-key="customers">العملاء</span></button><button onclick="sellersPage()">🏪 <span class="nav-label" data-admin-key="sellers">البائعون</span></button>${superAdmin?`<button class="super" onclick="adminsPage()">👑 <span class="nav-label" data-admin-key="admins">المدراء والصلاحيات</span></button>`:''}<button onclick="settingsPage()">⚙️ <span class="nav-label" data-admin-key="settings">إعدادات المتجر</span></button><button onclick="auditPage()">🛡️ <span class="nav-label" data-admin-key="security">سجل الأمان</span></button><button onclick="logout()">↩️ <span class="nav-label" data-admin-key="logout">تسجيل الخروج</span></button></div></aside><div class="mobile-head"><button class="btn mobile-menu-btn" onclick="toggleMobileSide()">☰</button><b>بازار</b><button class="btn" onclick="dashboard()">الرئيسية</button></div>`}
function toggleSide(){document.body.classList.toggle('side-collapsed');localStorage.setItem('bazaar_admin_side_collapsed',document.body.classList.contains('side-collapsed')?'1':'0')}
function toggleMobileSide(){document.getElementById('adminSide')?.classList.toggle('open')}
function closeMobileSide(){document.getElementById('adminSide')?.classList.remove('open')}

function dashboard(){const totalStock=products.reduce((a,p)=>a+Number(p.stock||0),0);const featured=products.filter(p=>p.featured).length;app.innerHTML=`<div class="shell">${nav()}<main class="main"><div class="wrap"><div class="topbar"><h1>لوحة التحكم</h1><div class="userbox">${me?.profile?.role==='super_admin'?'👑 SUPER ADMIN':'مدير المتجر'} • ${esc(me?.profile?.full_name||me?.user?.email||'')}</div></div><div class="hero"><h2>مرحبًا بك في إدارة بازار 👋</h2><p>تحكم كامل في المتجر، العملاء، البائعين والطلبات من لوحة واحدة.</p><div class="quick"><button onclick="customersPage()">👥<br><b>إدارة العملاء</b><br><small>الحسابات والطلبات</small></button><button onclick="ordersPage()">🧾<br><b>متابعة الطلبات</b><br><small>الحالات والإرجاعات</small></button><button onclick="sellersPage()">🏪<br><b>إدارة البائعين</b><br><small>اعتماد ومتابعة</small></button><button onclick="productsPage()">📦<br><b>إدارة المنتجات</b><br><small>الأسعار والمخزون</small></button></div></div><div class="stats"><div class="stat"><div class="ico">📦</div><span>إجمالي المنتجات</span><b>${products.length}</b></div><div class="stat"><div class="ico">👥</div><span>العملاء</span><b>${customers.length}</b></div><div class="stat"><div class="ico">🏪</div><span>البائعون</span><b>${sellers.length}</b></div><div class="stat"><div class="ico">⭐</div><span>المنتجات المميزة</span><b>${featured}</b></div><div class="stat"><div class="ico">📊</div><span>إجمالي المخزون</span><b>${fmt(totalStock)}</b></div></div><div class="panel"><div class="section-title"><div><h2>الوصول السريع</h2><div class="small">أكثر الأقسام استخدامًا</div></div></div><div class="grid" style="margin-top:15px"><button class="btn primary" onclick="customersPage()">👥 إدارة العملاء</button><button class="btn" onclick="ordersPage()">🧾 جميع الطلبات</button><button class="btn" onclick="sellersPage()">🏪 البائعون</button><button class="btn" onclick="settingsPage()">⚙️ إعدادات المتجر</button></div></div></div></main></div>`}
function productsPage(){app.innerHTML=`<div class="wrap">${nav()}<div class="panel"><div class="grid"><div class="field"><label>بحث</label><input id="search" oninput="renderProducts()" placeholder="اسم المنتج أو الموديل"></div><div class="field"><label>التصنيف</label><select id="filter" onchange="renderProducts()"><option value="">الكل</option>${categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name_ar)}</option>`).join('')}</select></div></div><button class="btn primary" onclick="productForm()">+ إضافة منتج</button> <button class="btn" onclick="importProducts()">استيراد البيانات الحالية</button></div><div id="plist"></div></div>`;renderProducts()}
function renderProducts(){const q=(val('search')||'').toLowerCase(),f=val('filter')||'';const ps=products.filter(p=>(!f||p.category_id===f)&&(!q||[p.title,p.brand,p.model_code].join(' ').toLowerCase().includes(q)));document.getElementById('plist').innerHTML=ps.map(p=>`<div class="panel prod"><img src="${esc(p.images?.[0]||'')}"><div style="flex:1"><b>${esc(p.title)}</b><div class="small">${esc(p.category_name)} • ${esc(p.model_code||'')}</div><p>${fmt(p.variants?.[0]?.price||p.price)} ر.س • ${(p.variants||[]).length} خيار ${p.featured?'• ⭐':''} ${p.seller_number?`• رقم البائع ${esc(p.seller_number)}`:''}</p><button class="btn" onclick="productForm('${p.id}')">تعديل</button> <button class="btn" onclick="duplicateProduct('${p.id}')">نسخ</button> <button class="btn danger" onclick="deleteProduct('${p.id}')">حذف</button></div></div>`).join('')||'<div class="panel">لا توجد نتائج.</div>'}
function productForm(id){const p=id?products.find(x=>x.id===id):{title:'',model_code:'',description:'',brand:'',category_id:categories[0]?.id||null,images:[],trendyol_url:'',featured:false,active:true,variants:[{barcode:'',size:'',color:'',price:'',originalPrice:'',stock:''}]};variants=JSON.parse(JSON.stringify(p.variants||[]));app.innerHTML=`<div class="wrap">${nav()}<div class="panel"><h2>${id?'تعديل المنتج':'إضافة منتج'}</h2><div class="grid"><div class="field"><label>اسم المنتج</label><input id="title" value="${esc(p.title)}"></div><div class="field"><label>رمز الموديل</label><input id="model" value="${esc(p.model_code||'')}"></div><div class="field"><label>التصنيف</label><select id="cat">${categories.map(c=>`<option value="${c.id}" ${c.id===p.category_id?'selected':''}>${esc(c.name_ar)}</option>`).join('')}</select></div><div class="field"><label>البائع</label><select id="seller"><option value="">بدون بائع محدد</option>${sellers.map(x=>`<option value="${x.id}" ${x.id===p.seller_id?'selected':''}>${esc(x.store_name||x.full_name||'')} — رقم ${esc(x.seller_number)}</option>`).join('')}</select></div><div class="field"><label>الماركة</label><input id="brand" value="${esc(p.brand||'')}"></div></div><div class="field"><label>الوصف</label><textarea id="desc" rows="5">${esc(p.description||'')}</textarea></div><div class="field"><label>صور المنتج</label><input id="imageFiles" type="file" accept="image/*" multiple onchange="uploadImages()"><div id="imgs">${(p.images||[]).map(im=>`<img class="thumb" src="${esc(im)}">`).join('')}</div><textarea id="images" rows="4" placeholder="أو ضع روابط الصور، رابط في كل سطر">${(p.images||[]).join('\n')}</textarea></div><div class="grid"><div class="field"><label>رابط ترنديول</label><input id="trend" value="${esc(p.trendyol_url||'')}"></div><label class="field"><span>منتج مميز</span><input id="featured" type="checkbox" ${p.featured?'checked':''}></label><label class="field"><span>نشط في المتجر</span><input id="active" type="checkbox" ${p.active!==false?'checked':''}></label></div><h3>المقاسات والألوان والأسعار والمخزون</h3><p class="small">هنا تقدر تضيف مقاسات السجاد الحقيقية مثل 150×230 و200×300 بدون تخمين.</p><div id="vars"></div><button class="btn" onclick="addVar()">+ إضافة خيار</button><hr><button class="btn primary" onclick="saveProduct('${id||''}')">حفظ</button> <button class="btn" onclick="productsPage()">إلغاء</button></div></div>`;renderVars()}
function renderVars(){document.getElementById('vars').innerHTML=variants.map((v,i)=>`<div class="variant"><div class="variantgrid"><input placeholder="الباركود" value="${esc(v.barcode||'')}" oninput="variants[${i}].barcode=this.value"><input placeholder="المقاس" value="${esc(v.size||'')}" oninput="variants[${i}].size=this.value"><input placeholder="اللون" value="${esc(v.color||'')}" oninput="variants[${i}].color=this.value"><input placeholder="السعر" type="number" value="${esc(v.price??'')}" oninput="variants[${i}].price=Number(this.value)"><input placeholder="السعر الأصلي" type="number" value="${esc(v.originalPrice??'')}" oninput="variants[${i}].originalPrice=Number(this.value)"><input placeholder="المخزون" type="number" value="${esc(v.stock??'')}" oninput="variants[${i}].stock=Number(this.value)"></div><button class="btn danger" onclick="variants.splice(${i},1);renderVars()">حذف الخيار</button></div>`).join('')}
function addVar(){variants.push({barcode:'',size:'',color:'',price:0,originalPrice:0,stock:0});renderVars()}

/* ===== BAZAAR PEOPLE MANAGEMENT V4 ===== */
function currentSession(){return sb.auth.getSession().then(r=>r.data.session)}
async function restoreManagerSession(session){if(!session)return;try{await sb.auth.setSession({access_token:session.access_token,refresh_token:session.refresh_token})}catch(e){console.warn('session restore failed',e)}}
async function peopleRpc(name,args=[]){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}
function personInitial(name){return esc((name||'؟').trim().slice(0,1))}
function peopleModal(title,body){const x=document.createElement('div');x.className='modal-panel';x.innerHTML=`<div class="form-modal"><div class="section-title"><h2>${title}</h2><button class="btn" onclick="this.closest('.modal-panel').remove()">✕</button></div>${body}</div>`;document.body.appendChild(x);return x}

async function customersPage(){
  let list=[];let rpcError='';
  try{list=JSON.parse(JSON.stringify(await peopleRpc('admin_list_customers'))||'[]')}catch(e){rpcError=e.message||'تعذر تحميل العملاء';}
  customers=list;
  const total=list.length, active=list.filter(x=>x.account_active!==false).length, orders=list.reduce((a,x)=>a+Number(x.order_count||0),0), revenue=list.reduce((a,x)=>a+Number(x.order_total||0),0);
  app.innerHTML=`<div class="shell">${nav()}<main class="main"><div class="wrap"><div class="premium-header"><div><h1>إدارة العملاء</h1><p>إنشاء وتعديل وحذف سجلات العملاء ومراجعة نشاطهم وطلباتهم.</p></div><div class="people-actions"><button class="btn primary" onclick="customerForm()">＋ عميل جديد</button><button class="btn" onclick="customersPage()">↻ تحديث</button></div></div>${rpcError?`<div class="msg err">${esc(rpcError)}<br><span class="small">شغّل ملف SQL الخاص بإدارة العملاء والبائعين المرفق مع المشروع.</span></div>`:''}<div class="people-grid"><div class="people-stat"><span>إجمالي العملاء</span><b>${fmt(total)}</b></div><div class="people-stat"><span>الحسابات النشطة</span><b>${fmt(active)}</b></div><div class="people-stat"><span>إجمالي الطلبات</span><b>${fmt(orders)}</b></div><div class="people-stat"><span>إجمالي المشتريات</span><b>${fmt(revenue)} ر.س</b></div></div><div class="panel"><div class="searchbar"><input id="customerSearch" placeholder="ابحث بالاسم أو الجوال أو البريد أو رقم العميل" oninput="renderPeopleCustomers()"><select id="customerFilter" onchange="renderPeopleCustomers()"><option value="all">كل العملاء</option><option value="account">لديهم حساب دخول</option><option value="orders">لديهم طلبات</option></select></div><div id="customersTable" class="table-wrap" style="margin-top:15px"></div></div></div></main></div>`;
  window.__peopleCustomers=list;renderPeopleCustomers();applyAdminLanguage();
}
function renderPeopleCustomers(){const list=window.__peopleCustomers||[];const q=(val('customerSearch')||'').trim().toLowerCase(),f=val('customerFilter')||'all';const filtered=list.filter(c=>{const t=[c.full_name,c.phone,c.email,c.customer_number].join(' ').toLowerCase();if(q&&!t.includes(q))return false;if(f==='account'&&!c.account_id)return false;if(f==='orders'&&!Number(c.order_count))return false;return true});const el=document.getElementById('customersTable');if(!el)return;el.innerHTML=`<table class="table people-table"><thead><tr><th>العميل</th><th>رقم العميل</th><th>التواصل</th><th>الطلبات</th><th>المشتريات</th><th>آخر نشاط</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${filtered.map(c=>`<tr><td><div class="customer-name"><div class="avatar">${personInitial(c.full_name)}</div><div><b>${esc(c.full_name||'بدون اسم')}</b><div class="small">${esc(c.email||'بدون حساب دخول')}</div></div></div></td><td><span class="badge gold">#${esc(c.customer_number)}</span></td><td>${esc(c.phone||'—')}<br><span class="small">${esc(c.address||'')}</span></td><td><b>${fmt(c.order_count)}</b></td><td><b>${fmt(c.order_total)} ر.س</b></td><td>${c.last_order_at?new Date(c.last_order_at).toLocaleDateString('ar-SA'):'—'}</td><td>${c.account_id?`<span class="status-dot">حساب دخول</span>`:'<span class="badge gray">سجل فقط</span>'}</td><td><div class="actions"><button class="btn" onclick="customerDetails('${c.id}')">عرض</button><button class="btn" onclick="customerForm('${c.id}')">تعديل</button><button class="btn danger-fill" onclick="deleteCustomer('${c.id}')">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="8" style="text-align:center;padding:40px">لا توجد نتائج.</td></tr>'}</tbody></table>`}
async function loadAll(){
  const [p,c,s,sp]=await Promise.all([
    sb.from('products').select('*,categories(name_ar)').order('updated_at',{ascending:false}),
    sb.from('categories').select('*').order('sort_order'),
    sb.from('store_settings').select('*').eq('id',1).single(),
    sb.from('seller_profiles').select('id,seller_number,store_name,full_name,phone,approved,active').order('seller_number')
  ]);
  if(p.error||c.error||s.error||sp.error)throw new Error(p.error?.message||c.error?.message||s.error?.message||sp.error?.message);
  products=(p.data||[]).map(x=>({...x,category_name:x.categories?.name_ar||''}));
  categories=c.data||[];settings=s.data||{id:1,store_name:'بازار',currency:'SAR',settings:{}};sellers=sp.data||[];
  try{customers=JSON.parse(JSON.stringify(await peopleRpc('admin_list_customers'))||'[]')}catch(e){customers=[];console.warn('customer RPC unavailable',e)}
}
async function customerForm(id){const c=(window.__peopleCustomers||[]).find(x=>x.id===id)||{};const m=peopleModal(id?'تعديل بيانات العميل':'إنشاء عميل جديد',`<div class="grid"><div class="field"><label>اسم العميل *</label><input id="pf_name" value="${esc(c.full_name||'')}"></div><div class="field"><label>رقم الجوال *</label><input id="pf_phone" value="${esc(c.phone||'')}"></div><div class="field"><label>البريد الإلكتروني (اختياري لإنشاء حساب دخول)</label><input id="pf_email" type="email" value="${esc(c.email||'')}"></div><div class="field"><label>كلمة مرور الحساب (عند إنشاء حساب دخول)</label><input id="pf_password" type="password" placeholder="8 أحرف أو أكثر"></div></div><div class="field"><label>العنوان</label><textarea id="pf_address" rows="3">${esc(c.address||'')}</textarea></div><div class="hint">إذا أدخلت البريد وكلمة المرور عند إنشاء عميل جديد، سيُنشأ له حساب مشتري عبر Supabase Auth. لا يتم تخزين كلمة المرور في قاعدة بيانات الموقع.</div><div class="form-actions"><button class="btn primary" onclick="saveCustomer('${id||''}')">حفظ العميل</button><button class="btn" onclick="this.closest('.modal-panel').remove()">إلغاء</button></div>`);}
async function saveCustomer(id){const name=val('pf_name').trim(),phone=val('pf_phone').trim(),address=val('pf_address').trim(),email=val('pf_email').trim(),password=val('pf_password');if(!name||!phone)return alert('الاسم ورقم الجوال مطلوبان.');try{if(id){await peopleRpc('admin_update_customer',[id,name,phone,address||null]);}else{await peopleRpc('admin_create_customer',[name,phone,address||null]);if(email||password){if(!email||password.length<8)throw new Error('أدخل البريد وكلمة مرور من 8 أحرف أو أكثر لإنشاء حساب دخول.');const session=await currentSession();const {data,error}=await sb.auth.signUp({email,password,options:{data:{account_type:'buyer',full_name:name,phone,address}}});if(error)throw error;await restoreManagerSession(session);}}await audit(id?'update_customer':'create_customer',id||name);document.querySelector('.modal-panel')?.remove();await customersPage();alert(id?'تم تحديث العميل.':'تم إنشاء العميل بنجاح.');}catch(e){alert(e.message||'تعذر حفظ العميل.');}}
async function deleteCustomer(id){const c=(window.__peopleCustomers||[]).find(x=>x.id===id);if(!c||!confirm(`حذف سجل العميل ${c.full_name||''}؟\nالطلبات السابقة ستبقى محفوظة.`))return;try{await peopleRpc('admin_delete_customer',[id]);await audit('delete_customer',id);await customersPage();}catch(e){alert(e.message||'تعذر حذف العميل.')}}

async function customerDetails(id){const c=(window.__peopleCustomers||[]).find(x=>x.id===id);if(!c)return;const {data:orders,error}=await sb.from('orders').select('*').eq('customer_id',id).order('created_at',{ascending:false}).limit(100);if(error)return alert(error.message);const os=orders||[];const total=os.reduce((a,o)=>a+Number(o.total||0),0);peopleModal('ملف العميل',`<div class="panel"><div class="customer-name"><div class="avatar" style="width:58px;height:58px;font-size:22px">${personInitial(c.full_name)}</div><div><h2 style="margin:0">${esc(c.full_name||'بدون اسم')}</h2><div class="small">رقم العميل #${esc(c.customer_number)}</div></div></div><div class="grid" style="margin-top:15px"><div><b>الجوال</b><div class="small">${esc(c.phone||'—')}</div></div><div><b>البريد</b><div class="small">${esc(c.email||'—')}</div></div><div><b>العنوان</b><div class="small">${esc(c.address||'—')}</div></div><div><b>التسجيل</b><div class="small">${c.created_at?new Date(c.created_at).toLocaleString('ar-SA'):'—'}</div></div></div></div><div class="metric-row"><div class="metric">الطلبات<b>${os.length}</b></div><div class="metric">المشتريات<b>${fmt(total)} ر.س</b></div><div class="metric">آخر طلب<b>${os[0]?new Date(os[0].created_at).toLocaleDateString('ar-SA'):'—'}</b></div></div><div class="panel"><h3>الطلبات</h3>${os.map(o=>`<div style="padding:11px 0;border-bottom:1px solid #eee"><b>${esc(o.order_number||'طلب')}</b> — ${fmt(o.total)} ر.س <span class="badge gray">${esc(o.status||'—')}</span><div class="small">${new Date(o.created_at).toLocaleString('ar-SA')}</div></div>`).join('')||'<div class="small">لا توجد طلبات.</div>'}</div>`)}

async function sellersPage(){let list=[];const {data,error}=await sb.from('seller_profiles').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);const ids=(data||[]).map(x=>x.id);let prof=[];if(ids.length){const r=await sb.from('profiles').select('id,role,full_name').in('id',ids);prof=r.data||[]}const map=Object.fromEntries(prof.map(x=>[x.id,x]));list=(data||[]).map(x=>({...x,profile:map[x.id]||{}}));window.__peopleSellers=list;const active=list.filter(x=>x.active).length,approved=list.filter(x=>x.approved).length;app.innerHTML=`<div class="shell">${nav()}<main class="main"><div class="wrap"><div class="premium-header"><div><h1>إدارة البائعين</h1><p>إنشاء وتعديل واعتماد وإيقاف حسابات البائعين.</p></div><div class="people-actions"><button class="btn primary" onclick="sellerForm()">＋ بائع جديد</button><button class="btn" onclick="sellersPage()">↻ تحديث</button></div></div><div class="people-grid"><div class="people-stat"><span>إجمالي البائعين</span><b>${fmt(list.length)}</b></div><div class="people-stat"><span>المعتمدون</span><b>${fmt(approved)}</b></div><div class="people-stat"><span>النشطون</span><b>${fmt(active)}</b></div><div class="people-stat"><span>بانتظار الاعتماد</span><b>${fmt(list.length-approved)}</b></div></div><div class="panel"><div class="searchbar"><input id="sellerSearch" placeholder="ابحث باسم البائع أو المتجر أو الجوال" oninput="renderPeopleSellers()"><select id="sellerFilter" onchange="renderPeopleSellers()"><option value="all">الكل</option><option value="approved">معتمد</option><option value="pending">بانتظار الاعتماد</option><option value="active">نشط</option><option value="off">موقوف</option></select></div><div id="sellersTable" class="table-wrap" style="margin-top:15px"></div></div></div></main></div>`;renderPeopleSellers();applyAdminLanguage()}
function renderPeopleSellers(){const list=window.__peopleSellers||[];const q=(val('sellerSearch')||'').toLowerCase(),f=val('sellerFilter')||'all';const filtered=list.filter(s=>{const t=[s.full_name,s.store_name,s.phone,s.seller_number].join(' ').toLowerCase();if(q&&!t.includes(q))return false;if(f==='approved'&&!s.approved)return false;if(f==='pending'&&s.approved)return false;if(f==='active'&&!s.active)return false;if(f==='off'&&s.active)return false;return true});const el=document.getElementById('sellersTable');if(!el)return;el.innerHTML=`<table class="table people-table"><thead><tr><th>البائع</th><th>رقم البائع</th><th>المتجر</th><th>التواصل</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${filtered.map(s=>`<tr><td><div class="customer-name"><div class="avatar">${personInitial(s.full_name||s.store_name)}</div><div><b>${esc(s.full_name||'بدون اسم')}</b><div class="small">${esc(s.profile?.role||'staff')}</div></div></div></td><td><span class="badge gold">#${esc(s.seller_number)}</span></td><td><b>${esc(s.store_name||'متجري')}</b></td><td>${esc(s.phone||'—')}</td><td>${s.approved?'<span class="badge green">معتمد</span>':'<span class="badge gold">بانتظار</span>'} ${s.active?'<span class="badge green">نشط</span>':'<span class="badge red">موقوف</span>'}</td><td><div class="actions"><button class="btn" onclick="sellerForm('${s.id}')">تعديل</button>${!s.approved?`<button class="btn success-fill" onclick="setSellerApproval('${s.id}',true)">اعتماد</button>`:`<button class="btn" onclick="setSellerApproval('${s.id}',false)">إلغاء الاعتماد</button>`}${s.active?`<button class="btn danger-fill" onclick="deactivateSeller('${s.id}')">حذف/إيقاف</button>`:`<button class="btn success-fill" onclick="reactivateSeller('${s.id}')">تفعيل</button>`}</div></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;padding:40px">لا توجد نتائج.</td></tr>'}</tbody></table>`}
async function sellerForm(id){const s=(window.__peopleSellers||[]).find(x=>x.id===id)||{};peopleModal(id?'تعديل البائع':'إنشاء بائع جديد',`<div class="grid"><div class="field"><label>اسم البائع *</label><input id="sf_name" value="${esc(s.full_name||'')}"></div><div class="field"><label>اسم المتجر *</label><input id="sf_store" value="${esc(s.store_name||'')}"></div><div class="field"><label>رقم الجوال *</label><input id="sf_phone" value="${esc(s.phone||'')}"></div><div class="field"><label>البريد الإلكتروني *</label><input id="sf_email" type="email" value="${esc(s.email||'')}"></div></div>${id?'':'<div class="field"><label>كلمة مرور البائع *</label><input id="sf_password" type="password" placeholder="8 أحرف أو أكثر"></div>'}<div class="field"><label>نبذة المتجر</label><textarea id="sf_bio" rows="3">${esc(s.bio||'')}</textarea></div><div class="hint">سيُنشأ حساب الدخول من Supabase Auth. كلمة المرور لا تُحفظ في قاعدة بيانات بازار. البائع الجديد يبقى غير معتمد حتى يوافق المدير.</div><div class="form-actions"><button class="btn primary" onclick="saveSeller('${id||''}')">حفظ البائع</button><button class="btn" onclick="this.closest('.modal-panel').remove()">إلغاء</button></div>`)}
async function saveSeller(id){const name=val('sf_name').trim(),store=val('sf_store').trim(),phone=val('sf_phone').trim(),email=val('sf_email').trim(),password=val('sf_password'),bio=val('sf_bio').trim();if(!name||!store||!phone||(!id&&!email)||(!id&&!password))return alert('أكمل البيانات المطلوبة.');try{if(id){await peopleRpc('admin_update_seller',[id,name,store,phone,bio||null,true,!!((window.__peopleSellers||[]).find(x=>x.id===id)?.approved)]);await audit('update_seller',id);}else{if(password.length<8)return alert('كلمة المرور يجب أن تكون 8 أحرف أو أكثر.');const manager=await currentSession();const {data,error}=await sb.auth.signUp({email,password,options:{data:{account_type:'seller',full_name:name,phone,store_name:store}}});if(error)throw error;if(!data.user)throw new Error('تعذر إنشاء حساب البائع.');await restoreManagerSession(manager);await peopleRpc('admin_update_seller',[data.user.id,name,store,phone,bio||null,true,false]);await audit('create_seller',data.user.id);}document.querySelector('.modal-panel')?.remove();await sellersPage();alert(id?'تم تحديث بيانات البائع.':'تم إنشاء البائع وبقي بانتظار الاعتماد.');}catch(e){alert(e.message||'تعذر حفظ البائع.')}}
async function setSellerApproval(id,approved){try{await peopleRpc('approve_seller',[id,approved]);await audit(approved?'approve_seller':'revoke_seller',id);await sellersPage()}catch(e){alert(e.message||'تعذر تغيير الاعتماد.')}}
async function deactivateSeller(id){if(!confirm('سيتم إيقاف حساب البائع ومنع استخدامه كبائع، مع الحفاظ على بيانات الطلبات والمنتجات التاريخية. هل تريد المتابعة؟'))return;try{await peopleRpc('admin_deactivate_seller',[id]);await audit('deactivate_seller',id);await sellersPage()}catch(e){alert(e.message||'تعذر إيقاف البائع.')}}
async function reactivateSeller(id){try{await peopleRpc('admin_reactivate_seller',[id]);await audit('reactivate_seller',id);await sellersPage()}catch(e){alert(e.message||'تعذر تفعيل البائع.')}}

function applyAdminLanguage(){const l=BazaarI18n.get(),d=ADMIN_I18N[l]||ADMIN_I18N.ar;document.documentElement.lang=l;document.documentElement.dir=(l==='en'?'ltr':'rtl');const sel=document.getElementById('bazaarLang');if(sel){sel.value=l;const labels={ar:['العربية','دری','پښتو','فارسی','English'],en:['Arabic','Dari','Pashto','Persian','English'],fa:['عربی','دری','پشتو','فارسی','انگلیسی'],prs:['عربی','دری','پښتو','فارسی','انگلیسی'],ps:['عربي','دري','پښتو','فارسي','انګلیسي']};[...sel.options].forEach((o,i)=>o.textContent=(labels[l]||labels.ar)[i]);}document.querySelectorAll('[data-admin-key]').forEach(e=>{const k=e.dataset.adminKey;if(d[k])e.textContent=d[k]});document.querySelectorAll('[data-admin-placeholder]').forEach(e=>{const k=e.dataset.adminPlaceholder;if(d[k])e.placeholder=d[k]});const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){const t=n.nodeValue.trim();const k=ADMIN_TEXT[t];if(k&&d[k]&&n.parentElement&&!['SCRIPT','STYLE','OPTION'].includes(n.parentElement.tagName)){n.nodeValue=n.nodeValue.replace(t,d[k])}}}
function setAdminLanguage(l){if(!ADMIN_I18N[l])l='ar';BazaarI18n.set(l);localStorage.setItem('bazaar_lang',l);location.reload()}
(function(){if(localStorage.getItem('bazaar_admin_side_collapsed')==='1')document.body.classList.add('side-collapsed')})();
window.addEventListener('DOMContentLoaded',()=>{applyAdminLanguage();const lang=document.getElementById('bazaarLang');if(lang)lang.value=BazaarI18n.get();});
setInterval(applyAdminLanguage,350);
init();
</script><select id="bazaarLang" class="lang-select" onchange="setAdminLanguage(this.value)"><option value="ar">العربية</option><option value="prs">دری</option><option value="ps">پښتو</option><option value="fa">فارسی</option><option value="en">English</option></select></body></html>
