<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع الطلب | بازار</title><style>body{margin:0;background:#f7f4ef;font-family:Tahoma,Arial;color:#171717}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #e6dfd6;border-radius:22px;padding:24px;box-shadow:0 15px 50px #00000010}.field{margin:12px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd5cc;border-radius:11px}.btn{padding:13px 18px;border:0;border-radius:11px;background:#171717;color:#fff;font-weight:900;cursor:pointer}.muted{color:#777;font-size:13px}.result{margin-top:20px}.box{padding:14px;border-radius:12px;background:#f7f4ef;margin:8px 0}.ok{background:#eefbf3}.bad{background:#fff1f2;color:#991b1b}.back{display:inline-block;margin-bottom:18px;color:#6f5434;text-decoration:none}</style></head><body><div class="wrap"><a class="back" href="index.html">← العودة إلى بازار</a><div class="card"><h1>تتبع الطلب</h1><p class="muted">أدخل رقم الطلب ورقم الجوال المرتبط به لمعرفة حالة الطلب ومهلة الإرجاع.</p><div class="field"><label>رقم الطلب</label><input id="order" placeholder="BZ-20260912-000001"></div><div class="field"><label>رقم الجوال</label><input id="phone" inputmode="tel" placeholder="05xxxxxxxx"></div><button class="btn" onclick="track()">بحث عن الطلب</button><div id="result" class="result"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(BAZAAR_SUPABASE.url,BAZAAR_SUPABASE.publishableKey);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=n=>Number(n||0).toLocaleString('ar-SA');function status(s){return ({new:'جديد',confirmed:'مؤكد',processing:'قيد التجهيز',shipped:'تم الشحن',completed:'تم الاستلام',cancelled:'ملغي'})[s]||s}async function track(){const r=document.getElementById('result');r.innerHTML='جاري البحث...';const {data,error}=await sb.rpc('track_order',{p_order_number:document.getElementById('order').value.trim(),p_phone:document.getElementById('phone').value.trim()});if(error){r.innerHTML=`<div class="box bad">${esc(error.message)}</div>`;return}const d=data,dl=d.returnDeadline?new Date(d.returnDeadline):null;const open=dl&&Date.now()<=dl.getTime();r.innerHTML=`<div class="box ok"><b>الطلب ${esc(d.orderNumber)}</b><br>رقم العميل: ${esc(d.customerNumber)}<br>الحالة: ${esc(status(d.status))}<br>السداد: ${esc(d.paymentStatus)}<br>الإجمالي: ${fmt(d.total)} ر.س</div><div class="box">${d.deliveredAt?(open?`الإرجاع متاح حتى ${dl.toLocaleString('ar-SA')}`:'انتهت مهلة الإرجاع'): 'مهلة الإرجاع تبدأ بعد تسجيل الاستلام.'}</div>${d.deliveredAt&&open&&d.returnStatus==='none'?`<div class="field"><label>سبب الإرجاع</label><textarea id="reason" rows="3"></textarea></div><button class="btn" onclick="requestReturn('${esc(d.orderNumber)}')">طلب إرجاع</button>`:''}${d.returnStatus&&d.returnStatus!=='none'?`<div class="box">حالة طلب الإرجاع: ${esc(d.returnStatus)}</div>`:''}`}async function requestReturn(order){const {data,error}=await sb.rpc('request_return',{p_order_number:order,p_phone:document.getElementById('phone').value.trim(),p_reason:document.getElementById('reason')?.value||''});if(error)return alert(error.message);alert('تم تسجيل طلب الإرجاع. ستراجع الإدارة الطلب.');track()}</script></body></html>
