<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازار | الحساب</title>
<style>body{margin:0;background:#f7f4ef;font-family:Tahoma,Arial;color:#171717;min-height:100vh;display:grid;place-items:center}.card{width:min(500px,92vw);background:#fff;border:1px solid #e6dfd6;border-radius:24px;padding:28px;box-shadow:0 20px 60px #00000012}.brand{font-size:34px;font-weight:900;text-align:center}.sub{text-align:center;color:#777;margin:8px 0 20px}.lang{display:flex;justify-content:center;margin:0 0 16px}.lang select{padding:9px 12px;border:1px solid #ddd;border-radius:10px}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:18px}.tabs button{padding:11px 7px;border:1px solid #ddd;border-radius:12px;background:#fff;cursor:pointer;font-weight:700}.tabs .active{background:#171717;color:#fff}.field{margin:11px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd5cc;border-radius:11px}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#171717;color:#fff;font-weight:900;cursor:pointer;margin-top:8px}.msg{padding:11px;border-radius:10px;background:#fff7ed;color:#805313;margin:12px 0;font-size:13px;line-height:1.8}.hint{font-size:12px;color:#777;line-height:1.8}.back{text-align:center;margin-top:18px}.back a{color:#7b5a35;text-decoration:none}</style></head><body><main class="card"><div class="brand">بازار</div><div class="sub" id="sub">اختياراتك في مكان واحد</div><div class="lang"><select id="language" onchange="setLang(this.value)"><option value="ar">العربية</option><option value="prs">دری</option><option value="ps">پښتو</option><option value="fa">فارسی</option><option value="en">English</option></select></div><div class="tabs"><button id="tLogin" onclick="mode='login';render()">تسجيل الدخول</button><button id="tBuyer" onclick="mode='buyer';render()">حساب مشتري</button><button id="tSeller" onclick="mode='seller';render()">حساب بائع</button></div><div id="app"></div><div class="back"><a id="back" href="index.html">← العودة إلى المتجر</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script>
const sb=supabase.createClient(BAZAAR_SUPABASE.url,BAZAAR_SUPABASE.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let mode='login',msg='';const app=document.getElementById('app');
function T(k){return BazaarI18n.t(k)} function setLang(l){BazaarI18n.set(l);render(msg)}
function langOptions(){return `<option value="ar">العربية</option><option value="prs">دری</option><option value="ps">پښتو</option><option value="fa">فارسی</option><option value="en">English</option>`}
function render(m=''){msg=m;document.getElementById('language').value=BazaarI18n.get();['tLogin','tBuyer','tSeller'].forEach(id=>document.getElementById(id).className='');document.getElementById(mode==='login'?'tLogin':mode==='buyer'?'tBuyer':'tSeller').className='active';document.getElementById('sub').textContent=T('tag');document.getElementById('back').textContent='← '+T('back');
let common=m?`<div class="msg">${esc(m)}</div>`:'';
if(mode==='login')app.innerHTML=common+`<div class="field"><label>${T('email')}</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>${T('password')}</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" onclick="login()">${T('login')}</button>`;
else if(mode==='buyer')app.innerHTML=common+`<div class="field"><label>${T('fullName')}</label><input id="name" autocomplete="name"></div><div class="field"><label>${T('phone')}</label><input id="phone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>${T('address')}</label><input id="address" autocomplete="street-address"></div><div class="field"><label>${T('email')}</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>${T('password')}</label><input id="password" type="password" minlength="8" autocomplete="new-password"></div><button class="btn" onclick="signupBuyer()">${T('create')}</button>`;
else app.innerHTML=common+`<div class="field"><label>${T('fullName')}</label><input id="name" autocomplete="name"></div><div class="field"><label>${T('storeName')}</label><input id="store"></div><div class="field"><label>${T('phone')}</label><input id="phone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>${T('email')}</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>${T('password')}</label><input id="password" type="password" minlength="8" autocomplete="new-password"></div><button class="btn" onclick="signupSeller()">${T('newSeller')}</button><p class="hint">${T('sellerPending')}</p>`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return render(T('email')+' / '+T('password'));const {error}=await sb.auth.signInWithPassword({email,password});if(error)return render(error.message);await routeUser()}
async function routeUser(){const {data:{user}}=await sb.auth.getUser();if(!user)return location.href='index.html';const {data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role==='seller')return location.href='seller.html';if(p?.role==='super_admin'||p?.role==='admin'||p?.role==='staff')return location.href='admin.html';location.href='index.html'}
async function signupBuyer(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!name||!phone||!email||password.length<8)return render('يرجى إكمال البيانات واستخدام كلمة مرور من 8 أحرف على الأقل.');const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name,phone,address,account_type:'buyer'}}});if(error)return render(error.message);if(data.session)return routeUser();render('تم إنشاء حساب المشتري. إذا كان تأكيد البريد مفعّلًا، افتح بريدك الإلكتروني ثم سجّل الدخول.')}
async function signupSeller(){const name=document.getElementById('name').value.trim(),store=document.getElementById('store').value.trim(),phone=document.getElementById('phone').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!name||!store||!phone||!email||password.length<8)return render('يرجى إكمال جميع البيانات واستخدام كلمة مرور من 8 أحرف على الأقل.');const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name,store_name:store,phone,account_type:'seller'}}});if(error)return render(error.message);if(data.session)return routeUser();render('تم إرسال طلب إنشاء حساب البائع. افتح بريدك للتأكيد إن كان مطلوبًا، ثم انتظر موافقة إدارة بازار.')}
render();
</script></body></html>
