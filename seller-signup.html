<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازار | إنشاء حساب بائع</title><style>body{margin:0;background:#f7f4ef;font-family:Tahoma,Arial;color:#171717;min-height:100vh;display:grid;place-items:center}.card{width:min(500px,92vw);background:#fff;border:1px solid #e6dfd6;border-radius:24px;padding:28px;box-shadow:0 20px 60px #00000012}.brand{text-align:center;font-size:34px;font-weight:900}.sub{text-align:center;color:#777;margin:8px 0 20px}.lang{text-align:center;margin-bottom:16px}.lang select{padding:9px;border:1px solid #ddd;border-radius:10px}.field{margin:11px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd5cc;border-radius:11px}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#171717;color:#fff;font-weight:900;cursor:pointer;margin-top:8px}.msg{padding:11px;border-radius:10px;background:#fff7ed;color:#805313;margin:12px 0;font-size:13px;line-height:1.8}.hint{font-size:12px;color:#777;line-height:1.8}.links{text-align:center;margin-top:18px}.links a{color:#7b5a35;text-decoration:none;margin:0 8px}</style></head><body><main class="card"><div class="brand">بازار</div><div class="sub" id="sub">إنشاء حساب بائع جديد</div><div class="lang"><select onchange="setLang(this.value)"><option value="ar">العربية</option><option value="prs">دری</option><option value="ps">پښتو</option><option value="fa">فارسی</option><option value="en">English</option></select></div><div id="msg"></div><div class="field"><label>الاسم الكامل</label><input id="name" autocomplete="name"></div><div class="field"><label>اسم المتجر</label><input id="store"></div><div class="field"><label>رقم الجوال</label><input id="phone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" minlength="8" autocomplete="new-password"></div><button class="btn" id="create" onclick="signup()">إنشاء حساب بائع جديد</button><p class="hint" id="hint">سيتم إنشاء الحساب برقم بائع مستقل، ثم تراجعه إدارة بازار قبل السماح بالبيع.</p><div class="links"><a href="login.html">تسجيل الدخول</a><a href="signup.html">حساب مشتري</a><a href="index.html">العودة إلى المتجر</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script>const sb=supabase.createClient(BAZAAR_SUPABASE.url,BAZAAR_SUPABASE.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const D={ar:{sub:'إنشاء حساب بائع جديد',create:'إنشاء حساب بائع جديد',hint:'سيتم إنشاء الحساب برقم بائع مستقل، ثم تراجعه إدارة بازار قبل السماح بالبيع.'},en:{sub:'Create new seller account',create:'Create seller account',hint:'Your seller account receives a unique seller number and must be approved by Bazar before selling.'},fa:{sub:'ایجاد حساب فروشنده جدید',create:'ایجاد حساب فروشنده',hint:'حساب فروشنده شما یک شماره مستقل دریافت می‌کند و پیش از فروش باید توسط مدیریت بازار تأیید شود.'},prs:{sub:'ایجاد حساب فروشنده جدید',create:'ایجاد حساب فروشنده',hint:'حساب فروشنده شما شماره مستقل دریافت می‌کند و پیش از فروش نیاز به تأیید مدیریت بازار دارد.'},ps:{sub:'د نوي پلورونکي حساب جوړول',create:'د پلورونکي حساب جوړول',hint:'ستاسو حساب به ځانګړې د پلورونکي شمېره ولري او له پلور مخکې د بازار د مدیریت تایید ته اړتیا لري.'}};function setLang(l){BazaarI18n.set(l);const d=D[l]||D.ar;document.getElementById('sub').textContent=d.sub;document.getElementById('create').textContent=d.create;document.getElementById('hint').textContent=d.hint}function err(x){document.getElementById('msg').innerHTML='<div class="msg">'+String(x).replace(/[&<>]/g,'')+'</div>'}async function signup(){const btn=document.getElementById('create');btn.disabled=true;const name=document.getElementById('name').value.trim(),store=document.getElementById('store').value.trim(),phone=document.getElementById('phone').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!name||!store||!phone||!email||password.length<8){btn.disabled=false;return err('يرجى إكمال جميع البيانات وكلمة المرور 8 أحرف على الأقل.');}const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name,store_name:store,phone,account_type:'seller'}}});if(error){btn.disabled=false;const m=String(error.message||'').toLowerCase();if(m.includes('database error saving new user')) return err('تعذر إنشاء الحساب بسبب إعداد قاعدة البيانات. شغّل ملف SELLER_SIGNUP_REPAIR.sql في Supabase SQL Editor مرة واحدة ثم أعد المحاولة.');return err(error.message);}if(data.session)location.href='seller.html';else {btn.disabled=false;err('تم إنشاء طلب البائع. تحقق من البريد الإلكتروني إذا كان التحقق مطلوبًا، ثم انتظر موافقة إدارة بازار.')}}setLang(BazaarI18n.get());</script></body></html>
