<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><title>بازار | إنشاء حساب مشتري</title><style>body{margin:0;background:#f7f4ef;font-family:'Tajawal',Tahoma,Arial;color:#171717;min-height:100vh;display:grid;place-items:center}.card{width:min(500px,92vw);background:#fff;border:1px solid #e6dfd6;border-radius:24px;padding:28px;box-shadow:0 20px 60px #00000012}.brand{text-align:center;font-size:34px;font-weight:900}.sub{text-align:center;color:#777;margin:8px 0 20px}.lang{text-align:center;margin-bottom:16px}.lang select{padding:9px;border:1px solid #ddd;border-radius:10px}.field{margin:11px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd5cc;border-radius:11px}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#171717;color:#fff;font-weight:900;cursor:pointer;margin-top:8px}.msg{padding:11px;border-radius:10px;background:#fff7ed;color:#805313;margin:12px 0;font-size:13px;line-height:1.8}.links{text-align:center;margin-top:18px}.links a{color:#7b5a35;text-decoration:none;margin:0 8px}</style></head><body><main class="card"><div class="brand">بازار</div><div class="sub" id="sub">إنشاء حساب مشتري جديد</div><div class="lang"><select onchange="setLang(this.value)"><option value="ar">العربية</option><option value="prs">دری</option><option value="ps">پښتو</option><option value="fa">فارسی</option><option value="en">English</option></select></div><div id="msg"></div><div class="field"><label id="lName">الاسم الكامل</label><input id="name" autocomplete="name"></div><div class="field"><label id="lPhone">رقم الجوال</label><input id="phone" inputmode="tel" autocomplete="tel"></div><div class="field"><label id="lAddress">العنوان</label><input id="address" autocomplete="street-address"></div><div class="field"><label id="lEmail">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label id="lPass">كلمة المرور</label><input id="password" type="password" minlength="8" autocomplete="new-password"></div><button class="btn" id="create" onclick="signup()">إنشاء الحساب</button><div class="links"><a href="login.html" id="loginLink">تسجيل الدخول</a><a href="seller-signup.html" id="sellerLink">إنشاء حساب بائع</a><a href="index.html" id="back">العودة إلى المتجر</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script>const sb=supabase.createClient(BAZAAR_SUPABASE.url,BAZAAR_SUPABASE.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const D={ar:{sub:'إنشاء حساب مشتري جديد',create:'إنشاء الحساب',login:'تسجيل الدخول',seller:'إنشاء حساب بائع',back:'العودة إلى المتجر'},en:{sub:'Create new buyer account',create:'Create account',login:'Sign in',seller:'Create seller account',back:'Back to store'},fa:{sub:'ایجاد حساب خریدار جدید',create:'ایجاد حساب',login:'ورود',seller:'ایجاد حساب فروشنده',back:'بازگشت به فروشگاه'},prs:{sub:'ایجاد حساب خریدار جدید',create:'ایجاد حساب',login:'ورود',seller:'ایجاد حساب فروشنده',back:'بازگشت به فروشگاه'},ps:{sub:'د نوي پېرودونکي حساب جوړول',create:'حساب جوړول',login:'ننوتل',seller:'د پلورونکي حساب جوړول',back:'پلورنځي ته ستنېدل'}};function setLang(l){BazaarI18n.set(l);const d=D[l]||D.ar;document.getElementById('sub').textContent=d.sub;document.getElementById('create').textContent=d.create;document.getElementById('loginLink').textContent=d.login;document.getElementById('sellerLink').textContent=d.seller;document.getElementById('back').textContent=d.back}function err(x){document.getElementById('msg').innerHTML='<div class="msg">'+String(x).replace(/[&<>]/g,'')+'</div>'}async function signup(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!name||!phone||!email||password.length<8)return err('يرجى إكمال البيانات وكلمة المرور 8 أحرف على الأقل.');const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name,phone,address,account_type:'buyer'}}});if(error)return err(error.message);if(data.session)location.href='index.html';else err('تم إنشاء الحساب. تحقق من بريدك الإلكتروني ثم سجّل الدخول.')}setLang(BazaarI18n.get());</script></body></html>
