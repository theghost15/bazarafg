<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة البائع | بازار</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>body{margin:0;background:#f5f5f5;font-family:'Tajawal',Tahoma,Arial;color:#222}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.btn,.tab{border:1px solid #ccc;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.primary{background:#111;color:#fff;border-color:#111}.danger{color:#b00020}.panel,.stat{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat b{display:block;font-size:24px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px;margin:10px 0}.field input,.field textarea,.field select{padding:11px;border:1px solid #ccc;border-radius:9px;font:inherit}.prod{display:flex;gap:14px;border-top:1px solid #eee;padding:14px 0}.prod img{width:85px;height:85px;object-fit:cover;border-radius:10px;background:#eee}.variant{border:1px solid #ddd;border-radius:12px;padding:10px;margin:8px 0}.variantgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.variantgrid input{padding:9px;border:1px solid #ccc;border-radius:8px}.thumb{width:90px;height:90px;object-fit:cover;border-radius:10px;margin:5px;border:1px solid #ddd}.small{color:#777;font-size:13px}.login{max-width:430px;margin:80px auto}.msg{padding:10px;border-radius:10px;background:#f6f6f6;margin:10px 0}.err{background:#fff1f2;color:#991b1b}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.variantgrid{grid-template-columns:repeat(2,1fr)}} </style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script>const sb=supabase.createClient(BAZAAR_SUPABASE.url,BAZAAR_SUPABASE.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const app=document.getElementById('app');let me=null,profile=null,products=[],categories=[],variants=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const val=id=>document.getElementById(id)?.value||'';const fmt=n=>Number(n||0).toLocaleString('ar-SA');
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='login.html';const {data:{user}}=await sb.auth.getUser();const {data:p,error}=await sb.from('profiles').select('role,full_name').eq('id',user.id).single();if(error||p?.role!=='seller')return location.href='login.html';const {data:s}=await sb.from('seller_profiles').select('*').eq('id',user.id).single();if(!s?.approved||!s?.active)return blocked();me=user;profile=s;await load();dashboard()}
function blocked(){app.innerHTML='<div class="login panel"><h2>حسابك بانتظار الموافقة</h2><p class="small">تم إنشاء حساب البائع، لكن الإدارة لم تعتمد الحساب بعد. بعد الموافقة يمكنك الدخول إلى لوحة البائع.</p><button class="btn primary" onclick="logout()">خروج</button></div>'}
async function load(){const [p,c]=await Promise.all([sb.from('products').select('*,categories(name_ar)').eq('seller_id',me.id).order('updated_at',{ascending:false}),sb.from('categories').select('*').eq('active',true).order('sort_order')]);if(p.error)throw p.error;products=(p.data||[]).map(x=>({...x,category_name:x.categories?.name_ar||''}));categories=c.data||[]}
function nav(){return `<div class="top"><div><b style="font-size:26px">${esc(profile.store_name||'متجري')}</b><div class="small">لوحة البائع — ${esc(profile.full_name||'')}</div></div><div><a class="btn" href="index.html">${BazaarI18n.t('store')}</a> <button class="btn" onclick="profilePage()">${BazaarI18n.t('storeData')}</button> <button class="btn" onclick="logout()">${BazaarI18n.t('logout')}</button></div></div><div class="tabs"><button class="tab" onclick="dashboard()">${BazaarI18n.t('home')}</button><button class="tab" onclick="productsPage()">${BazaarI18n.t('myProducts')}</button><button class="tab" onclick="ordersPage()">${BazaarI18n.t('myOrders')}</button></div>`}
function dashboard(){app.innerHTML=`<div class="wrap">${nav()}<div class="stats"><div class="stat">منتجاتي<b>${products.length}</b></div><div class="stat">النشطة<b>${products.filter(p=>p.active).length}</b></div><div class="stat">المميزة<b>${products.filter(p=>p.featured).length}</b></div><div class="stat">المخزون<b>${products.reduce((a,p)=>a+Number(p.stock||0),0)}</b></div></div><div class="panel"><h2>مرحبًا ${esc(profile.full_name||'')}</h2><p>من هنا تتحكم في منتجات متجرك فقط. لا يمكنك الوصول إلى منتجات أو إعدادات البائعين الآخرين.</p><button class="btn primary" onclick="productsPage()">إدارة المنتجات</button></div></div>`}
function productsPage(){app.innerHTML=`<div class="wrap">${nav()}<div class="panel"><button class="btn primary" onclick="productForm()">+ إضافة منتج</button></div><div id="list"></div></div>`;renderProducts()}
function renderProducts(){document.getElementById('list').innerHTML=products.map(p=>`<div class="panel prod"><img src="${esc(p.images?.[0]||'')}"><div style="flex:1"><b>${esc(p.title)}</b><div class="small">${esc(p.category_name)} • ${Number(p.stock||0)} في المخزون</div><p>${fmt(p.variants?.[0]?.price||p.price)} ر.س</p><button class="btn" onclick="productForm('${p.id}')">تعديل</button> <button class="btn danger" onclick="deleteProduct('${p.id}')">حذف</button></div></div>`).join('')||'<div class="panel">لا توجد منتجات حتى الآن.</div>'}
function productForm(id){const p=id?products.find(x=>x.id===id):{title:'',description:'',brand:'',category_id:categories[0]?.id||null,images:[],trendyol_url:'',active:true,variants:[{barcode:'',size:'',color:'',price:0,originalPrice:0,stock:0}]};variants=JSON.parse(JSON.stringify(p.variants||[]));app.innerHTML=`<div class="wrap">${nav()}<div class="panel"><h2>${id?'تعديل المنتج':'إضافة منتج'}</h2><div class="grid"><div class="field"><label>اسم المنتج</label><input id="title" value="${esc(p.title)}"></div><div class="field"><label>الماركة</label><input id="brand" value="${esc(p.brand||'')}"></div><div class="field"><label>التصنيف</label><select id="cat">${categories.map(c=>`<option value="${c.id}" ${c.id===p.category_id?'selected':''}>${esc(c.name_ar)}</option>`).join('')}</select></div></div><div class="field"><label>الوصف</label><textarea id="desc" rows="5">${esc(p.description||'')}</textarea></div><div class="field"><label>صور المنتج</label><input id="imageFiles" type="file" accept="image/*" multiple onchange="uploadImages()"><div id="imgs">${(p.images||[]).map(im=>`<img class="thumb" src="${esc(im)}">`).join('')}</div><textarea id="images" rows="4" placeholder="رابط صورة في كل سطر">${(p.images||[]).join('\n')}</textarea></div><div class="field"><label>رابط ترنديول (اختياري)</label><input id="trend" value="${esc(p.trendyol_url||'')}"></div><label class="field"><span>نشط في المتجر</span><input id="active" type="checkbox" ${p.active!==false?'checked':''}></label><h3>المقاسات والألوان والأسعار والمخزون</h3><div id="vars"></div><button class="btn" onclick="addVar()">+ إضافة خيار</button><hr><button class="btn primary" onclick="saveProduct('${id||''}')">حفظ</button> <button class="btn" onclick="productsPage()">إلغاء</button></div></div>`;renderVars()}
function renderVars(){document.getElementById('vars').innerHTML=variants.map((v,i)=>`<div class="variant"><div class="variantgrid"><input placeholder="الباركود" value="${esc(v.barcode||'')}" oninput="variants[${i}].barcode=this.value"><input placeholder="المقاس" value="${esc(v.size||'')}" oninput="variants[${i}].size=this.value"><input placeholder="اللون" value="${esc(v.color||'')}" oninput="variants[${i}].color=this.value"><input placeholder="السعر" type="number" value="${esc(v.price??0)}" oninput="variants[${i}].price=Number(this.value)"><input placeholder="السعر الأصلي" type="number" value="${esc(v.originalPrice??0)}" oninput="variants[${i}].originalPrice=Number(this.value)"><input placeholder="المخزون" type="number" value="${esc(v.stock??0)}" oninput="variants[${i}].stock=Number(this.value)"></div><button class="btn danger" onclick="variants.splice(${i},1);renderVars()">حذف الخيار</button></div>`).join('')}
function addVar(){variants.push({barcode:'',size:'',color:'',price:0,originalPrice:0,stock:0});renderVars()}
async function uploadImages(){const files=[...document.getElementById('imageFiles').files];const out=[];for(const f of files){const path=`sellers/${me.id}/${crypto.randomUUID()}-${f.name.replace(/[^\w.-]+/g,'_')}`;const {error}=await sb.storage.from('bazaar-images').upload(path,f,{upsert:false,contentType:f.type});if(error){alert(error.message);continue}out.push(sb.storage.from('bazaar-images').getPublicUrl(path).data.publicUrl)}document.getElementById('images').value=[...new Set(document.getElementById('images').value.split('\n').filter(Boolean).concat(out))].join('\n');document.getElementById('imgs').innerHTML=document.getElementById('images').value.split('\n').filter(Boolean).map(x=>`<img class="thumb" src="${esc(x)}">`).join('')}
async function saveProduct(id){const images=val('images').split('\n').map(x=>x.trim()).filter(Boolean),stock=variants.reduce((a,v)=>a+Number(v.stock||0),0),row={seller_id:me.id,title:val('title'),description:val('desc'),brand:val('brand'),category_id:val('cat')||null,price:Number(variants[0]?.price||0),original_price:Number(variants[0]?.originalPrice||0),stock,active:document.getElementById('active').checked,trendyol_url:val('trend'),images,variants};const q=id?sb.from('products').update(row).eq('id',id).eq('seller_id',me.id):sb.from('products').insert(row);const {error}=await q;if(error)return alert(error.message);await load();productsPage()}
async function deleteProduct(id){if(!confirm('حذف المنتج نهائيًا؟'))return;const {error}=await sb.from('products').delete().eq('id',id).eq('seller_id',me.id);if(error)return alert(error.message);await load();productsPage()}
function profilePage(){app.innerHTML=`<div class="wrap">${nav()}<div class="panel"><h2>بيانات المتجر</h2><div class="field"><label>اسم المتجر</label><input id="store" value="${esc(profile.store_name||'')}"></div><div class="field"><label>اسم البائع</label><input id="name" value="${esc(profile.full_name||'')}"></div><div class="field"><label>الجوال</label><input id="phone" value="${esc(profile.phone||'')}"></div><div class="field"><label>العنوان *</label><input id="address" value="${esc(profile.address||'')}" autocomplete="street-address"></div><div class="field"><label>نبذة</label><textarea id="bio">${esc(profile.bio||'')}</textarea></div><button class="btn primary" onclick="saveProfile()">حفظ</button></div></div>`}
async function saveProfile(){const {error}=await sb.from('seller_profiles').update({store_name:val('store'),full_name:val('name'),phone:val('phone'),address:val('address'),bio:val('bio')}).eq('id',me.id);if(error)return alert(error.message);profile={...profile,store_name:val('store'),full_name:val('name'),phone:val('phone'),address:val('address'),bio:val('bio')};dashboard()}

async function ordersPage(){const {data,error}=await sb.rpc('get_seller_orders');if(error)return alert(error.message);const rows=(data||[]).map(o=>{const items=(o.items||[]).filter(i=>i.sellerId===me.id);return `<div class="panel"><h3>${esc(o.order_number||'طلب')}</h3><div class="small">العميل #${esc(o.customer_number||'—')} • ${esc(o.customer_name)} • ${esc(o.customer_phone)}</div><div class="small">الحالة: ${esc(o.status)} • السداد: ${esc(o.payment_status)}</div><div class="small">مهلة الإرسال: ${o.seller_dispatch_deadline?new Date(o.seller_dispatch_deadline).toLocaleString('ar-SA'):'—'}</div><div style="margin:10px 0">${items.map(i=>`<div>${esc(i.title)} — الكمية ${esc(i.qty)} — ${fmt(i.unitPrice)} ر.س</div>`).join('')}</div>${['new','confirmed'].includes(o.status)?`<button class="btn primary" onclick="markDispatch('${o.id}')">بدأت تجهيز الطلب</button>`:''}</div>`}).join('');app.innerHTML=`<div class="wrap">${nav()}<div class="panel"><h2>طلبات منتجاتي</h2><p class="small">تظهر هنا الطلبات التي تحتوي على منتجاتك فقط. المطلوب تجهيز المنتج وإرساله خلال يومين من إنشاء الطلب.</p>${rows||'<div class="small">لا توجد طلبات مرتبطة بمنتجاتك.</div>'}</div></div>`}
async function markDispatch(id){const {error}=await sb.rpc('seller_mark_dispatch_ready',{p_order_id:id});if(error)return alert(error.message);ordersPage()}

async function logout(){await sb.auth.signOut();location.href='login.html'}init();</script><select id="bazaarLang" onchange="BazaarI18n.set(this.value);location.reload()" style="position:fixed;left:18px;bottom:18px;z-index:9999;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff"><option value="ar">العربية</option><option value="prs">دری</option><option value="ps">پښتو</option><option value="fa">فارسی</option><option value="en">English</option></select></body></html>
